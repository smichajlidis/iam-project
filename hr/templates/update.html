{% extends 'base.html' %}

{% block head %}
<title>Human Resources System</title>
{% endblock %}

{% block body %}
<div class="content">
    <h1>Update the employee {{ employee.user_id }}</h1>

    <form method="POST" action="/update/{{ employee.user_id }}" class="form-grid">

        <label for="first_name">First name:</label>
        <input id="first_name" type="text" name="first_name" maxlength="20" value="{{ employee.first_name }}" required>

        <label for="last_name">Last name:</label>
        <input id="last_name" type="text" name="last_name" maxlength="20" value="{{ employee.last_name }}" required>

        <label for="business_role">Business role:</label>
        <input id="business_role" type="text" name="business_role" maxlength="20" value="{{ employee.business_role }}" required>

        <label for="manager">Manager (user_id):</label>
        <input id="manager" type="text" name="manager" maxlength="20" value="{{ employee.manager }}">

        <label for="valid_to">Valid to:</label>
        <input id="valid_to" type="date" name="valid_to">

        <label for="identity_status">Active?</label>
        <input id="identity_status" type="checkbox" name="identity_status" value="true" checked>

        <div></div>
        <button type="submit" class="form-submit">Update</button>

    </form>

</div>
{% endblock %}
