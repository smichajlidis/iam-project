{% extends 'base.html' %}

{% block head %}
<title>Request Management System</title>
{% endblock %}

{% block body %}
<div class="content">
    <h1>Update request</h1>

    <div class="form">
        <form action="/update/{{request.id}}" method="POST">
            <input type="text" name="content" id="content" value="{{request.content}}">
            <input type="submit" value="Update">
        </form>
    </div>
</div>
    {% endblock %}
